<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="A tank model: inflow in, water out, der(water) = (inflow - water) / tau_s">
<title>A tank model: inflow in, water out, der(water) = (inflow - water) / tau_s</title>
<style>
  .bg { fill: #ffffff; }
  .ink { fill: #1f2328; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .muted { fill: #59636e; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .line { stroke: #59636e; fill: none; }
  .grid { stroke: #d1d9e0; fill: none; }
  .box { fill: #f6f8fa; stroke: #59636e; }
  .accent { fill: #ddf4ff; stroke: #0969da; }
  .water { fill: #b6e3ff; }
  .s1 { stroke: #0969da; fill: none; }
  .s2 { stroke: #bc4c00; fill: none; }
  .k1, .k2 { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .k1 { fill: #0969da; } .k2 { fill: #bc4c00; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .ink { fill: #f0f6fc; } .muted { fill: #9198a1; }
    .line { stroke: #9198a1; } .grid { stroke: #3d444d; }
    .box { fill: #151b23; stroke: #9198a1; }
    .accent { fill: #0c2d6b; stroke: #4493f8; }
    .water { fill: #1f6feb; opacity: 0.45; }
    .s1 { stroke: #4493f8; } .s2 { stroke: #f0883e; }
    .k1 { fill: #4493f8; } .k2 { fill: #f0883e; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
 orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker></defs>
<rect class="bg" width="800" height="320" rx="8"/>

<text x="24" y="34" class="ink" font-size="17" font-weight="600">What the example simulates: a tank whose water follows its inflow</text>
<line x1="40" y1="150" x2="218" y2="150" class="line" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="136" class="ink" font-size="15">inflow</text>
<text x="40" y="174" class="muted" font-size="13">input, °C</text>
<text x="40" y="192" class="muted" font-size="13">replays sensor:inflow</text>
<rect x="230" y="70" width="340" height="170" rx="10" class="box" stroke-width="1.5"/>
<rect x="231" y="152" width="338" height="87" rx="9" class="water"/>
<text x="400" y="104" text-anchor="middle" class="ink" font-size="15" font-weight="600">Model.Tank</text>
<text x="400" y="134" text-anchor="middle" class="ink mono" font-size="13">der(water) = (inflow − water) / tau_s</text>
<text x="400" y="190" text-anchor="middle" class="ink" font-size="13">tau_s = 600 s · water_start = 20 °C</text>
<text x="400" y="212" text-anchor="middle" class="muted" font-size="12">parameters a run may change</text>
<line x1="582" y1="150" x2="760" y2="150" class="line" stroke-width="2" marker-end="url(#a)"/>
<text x="600" y="136" class="ink" font-size="15">water</text>
<text x="600" y="174" class="muted" font-size="13">output, °C</text>
<text x="600" y="192" class="muted" font-size="13">scored against sensor:water</text>
<text x="24" y="282" class="muted" font-size="13">The larger tau_s, the slower the water follows. The platform feeds the inflow a scenario gives, steps the FMU,</text>
<text x="24" y="300" class="muted" font-size="13">and compares the water it answers with the water that was measured.</text>

</svg>
