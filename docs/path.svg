<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="The path: Modelica, CI builds and tests the FMU, a tag registers it, the sandbox runs it, the platform scores it">
<title>The path: Modelica, CI builds and tests the FMU, a tag registers it, the sandbox runs it, the platform scores it</title>
<style>
